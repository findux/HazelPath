name: Windows release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $header = Get-Content -Raw src/AppVersion.h
          if ($header -notmatch '#define\s+HAZELPATH_VERSION\s+"(\d+\.\d+\.\d+)"') { throw 'Invalid version header.' }
          $version = $Matches[1]
          $tag = "v$version"
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -cne $tag) { throw 'Tag and AppVersion.h do not match.' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Download pinned openFrameworks SDK
        run: |
          $lock = Get-Content -Raw scripts/release-dependencies.json | ConvertFrom-Json
          curl.exe -L --fail --retry 3 --output "$env:RUNNER_TEMP/of-sdk.zip" $lock.openFrameworks.url
          if ($LASTEXITCODE -ne 0) { throw 'SDK download failed.' }
      - name: Prepare clean SDK and pinned addons
        id: prepare
        run: ./scripts/prepare-release.ps1 -SdkArchive "$env:RUNNER_TEMP/of-sdk.zip" -Destination "$env:RUNNER_TEMP/hazelpath-sdk"
      - name: Install NSIS
        run: |
          choco install nsis --version=3.11 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
      - name: Test, build and package Windows x64
        env:
          APP_ROOT: ${{ steps.prepare.outputs.app_root }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          & "$env:APP_ROOT/scripts/build-release.ps1" -Tag $env:RELEASE_TAG -OutputDirectory "$env:GITHUB_WORKSPACE/release-output"
      - name: Package sources and checksums
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git archive --format=zip "--prefix=HazelPath-$env:RELEASE_VERSION/" --output="release-output/HazelPath-$env:RELEASE_VERSION-source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed.' }
          Copy-Item scripts/release-dependencies.json release-output/
          "Commit: $env:GITHUB_SHA`nRunner: $env:ImageOS $env:ImageVersion`nRun: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" | Set-Content release-output/BUILD-INFO.txt
          Get-ChildItem release-output -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content release-output/SHA256SUMS.txt
      - name: Upload verified packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: HazelPath-windows-x64
          path: release-output/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: HazelPath-windows-x64
          path: packages
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" packages/* --verify-tag --draft --generate-notes --title "HazelPath $RELEASE_TAG"
